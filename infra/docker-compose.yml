name: wallet-track

services:
  postgres:
    image: docker.io/library/postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallet_track}
      POSTGRES_USER: ${POSTGRES_USER:-wallet_track}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_track_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ images keep PGDATA in a versioned directory under this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
