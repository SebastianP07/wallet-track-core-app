          description: Pending fixed and occasional items of the month, soonest due first.
        cardCharges:
          $ref: '#/components/schemas/CardChargeTotals'
        platforms:
          $ref: '#/components/schemas/PlatformList'
        people:
          $ref: '#/components/schemas/PersonList'
        overdue:
          $ref: '#/components/schemas/OverdueItemList'
      additionalProperties: false
