  /period-items/{id}/done:
    put:
      operationId: markPeriodItemDone
      summary: Mark an item paid or received
      tags:
      - Period items
      description: Idempotent. Never changes an account balance (D6). An overdue item keeps its `period` and
        its `owedIn`, so a paid overdue expense leaves `toPay` but stays in `outgoing` of the month that owes
        it (D2, D7). On a person-linked income item this records that person's payment in the same transaction
        (D4, D8), dated within the item's month and covering their `billingMonths`.
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Item is done. On a card charge this only records that the charge was seen, and moves no
            total (D3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: unmarkPeriodItemDone
      summary: Undo paid or received
      tags:
      - Period items
      description: Idempotent. On a person-linked income item this removes the payment linked to it, and no
        other, in the same transaction (D4, D8).
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Item is pending again, or overdue if it is an expense or income item of a closed
            month. An expense that becomes overdue again is owed in the month that owed it when it was paid, or
            else the month after its own, moving on to the first later month that is not closed (D7). A card
            charge is always pending again (D3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
