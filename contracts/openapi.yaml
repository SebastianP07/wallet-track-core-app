openapi: 3.1.1
info:
  title: Wallet Track API
  version: 1.0.0
  description: |
    HTTP contract of Wallet Track, a private single-user personal finance app. Decision numbers (D1-D11, T1-T7) refer to PLAN.md.

    Conventions:

    - Money is always an integer of whole COP, never a decimal.
    - The backend computes every total, KPI and urgency level (D1), so they appear only in responses.
    - Errors are `application/problem+json`.
    - Requests are authenticated by the `__Host-session` cookie. Every mutating request also sends `X-CSRF-Token`.
    - There is no public sign-up.
  license:
    name: Proprietary
    url: https://github.com/SebastianP07/wallet-track-core-app
servers:
- url: /api/v1
  description: Same origin. The browser calls the Next.js BFF, which forwards to the Go API.
security:
- sessionCookie: []
tags:
- name: Auth
  description: Password, TOTP, passkeys, MFA enrollment, recovery codes and sessions.
- name: Accounts
  description: Where money sits, including savings (D6, D9).
- name: Periods
  description: 'Monthly periods: open, close, list (D7).'
- name: Period items
  description: Fixed, occasional, income and card-charge items of a month.
- name: Recurring templates
  description: What opening a month clones into items.
- name: Tags
  description: Free-form colored labels that never affect totals (D5).
- name: Credit cards
  description: Cards that card charges are tracked against (D3).
- name: People
  description: Platform members and their payments (D4, D8).
- name: Platforms
  description: Shared subscriptions split across members (D10).
- name: Dashboard
  description: The aggregated view of a month (D2, D3, D11).
paths:
  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Issue a CSRF token
      tags:
      - Auth
      description: 'Double-submit source: call before the first mutating request. Send the token back
        in `X-CSRF-Token`.'
      security: []
      responses:
        '200':
          description: Token issued; the same value is set in the `__Host-csrf` cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCsrfCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login/password:
    post:
      operationId: loginWithPassword
      summary: 'Login step 1: password'
      tags:
      - Auth
      description: 'Failures return the same generic 401 whether or not the account exists. There is no
        sign-up endpoint: the owner is created with `cmd/admin create-owner`.'
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: Password accepted. A short-lived session limited to the second factor is set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginStep'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login/totp:
    post:
      operationId: loginWithTotp
      summary: 'Login step 2: TOTP code'
      tags:
      - Auth
      description: Requires the session from step 1.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        '200':
          description: Second factor accepted. The session is rotated and fully authenticated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login/recovery-code:
    post:
      operationId: loginWithRecoveryCode
      summary: 'Login step 2: recovery code'
      tags:
      - Auth
      description: Requires the session from step 1. Each code works once.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodeRequest'
      responses:
        '200':
          description: Code accepted and consumed. The session is rotated and fully authenticated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login/passkey/options:
    post:
      operationId: startPasskeyLogin
      summary: 'Login step 2: start a passkey assertion'
      tags:
      - Auth
      description: Requires the session from step 1. Stores a random challenge bound to that session, which
        works once and expires in 2 minutes, replacing any earlier one. 409 if the owner has no passkey,
        so the login falls back to TOTP. 429 while the second factor is locked.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Options for `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyAssertionOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login/passkey:
    post:
      operationId: loginWithPasskey
      summary: 'Login step 2: passkey assertion'
      tags:
      - Auth
      description: Requires the session from step 1. Consumes the session's challenge whatever the outcome,
        then checks origin, RP ID, challenge, signature, user verification and sign count. A rejected
        assertion is the generic 401 and counts toward the second-factor lockout.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyAssertionRequest'
      responses:
        '200':
          description: Assertion accepted. The session is rotated and fully authenticated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/mfa/enrollment:
    post:
      operationId: startMfaEnrollment
      summary: Start MFA enrollment
      tags:
      - Auth
      description: Requires the session from step 1, when `nextStep` is `enroll_mfa`, and the one-time
        enrollment secret that `cmd/admin create-owner` prints once. A wrong, expired or missing secret
        returns the same generic 401, never a 400. 409 if MFA is already enabled. The enrollment secret
        stays valid until it expires or enrollment is confirmed, so calling again replaces an unconfirmed
        TOTP secret.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollmentStartRequest'
      responses:
        '200':
          description: New TOTP secret to show as a QR code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/mfa/enrollment/confirm:
    post:
      operationId: confirmMfaEnrollment
      summary: Confirm MFA enrollment
      tags:
      - Auth
      description: Consumes the enrollment secret, so it cannot be used again. Returns the generic 401
        if it expired after enrollment started.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        '200':
          description: MFA enabled. The session is rotated and fully authenticated. The recovery codes
            are shown only here.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollmentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/recovery-codes:
    get:
      operationId: getRecoveryCodeStatus
      summary: Count unused recovery codes
      tags:
      - Auth
      responses:
        '200':
          description: Number of unused codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodeStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/recovery-codes/regenerate:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace all recovery codes
      tags:
      - Auth
      description: Requires a current TOTP code.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        '200':
          description: New codes, shown only here. All earlier codes stop working.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      operationId: logout
      summary: Log out this session
      tags:
      - Auth
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked and cookie cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Log out every session
      tags:
      - Auth
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: All sessions revoked and cookie cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/sessions:
    get:
      operationId: listSessions
      summary: List the owner's active sessions
      tags:
      - Auth
      description: Sessions neither revoked nor expired, most recently seen first. A session still waiting
        for its second factor is listed with `mfaPending`, because it means someone passed the password
        step. Token hashes never leave the server.
      responses:
        '200':
          description: The active sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Revoke a session
      tags:
      - Auth
      description: Ends that session at once. Revoking the current session also clears its cookie, like
        logging out.
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/passkeys:
    get:
      operationId: listPasskeys
      summary: List the owner's passkeys
      tags:
      - Auth
      description: Oldest first. Credential IDs and public keys never leave the server.
      responses:
        '200':
          description: The registered passkeys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/passkeys/registration/options:
    post:
      operationId: startPasskeyRegistration
      summary: Start registering a passkey
      tags:
      - Auth
      description: Requires a full session and a current second-factor proof, so a stolen session cannot
        silently add a credential. The proof is consumed here, and only then is a challenge stored, bound
        to this session, working once and expiring in 2 minutes. A rejected proof is the generic 401 and
        counts toward the second-factor lockout.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorProof'
      responses:
        '200':
          description: Options for `navigator.credentials.create()`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyCreationOptions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/passkeys/registration:
    post:
      operationId: finishPasskeyRegistration
      summary: Finish registering a passkey
      tags:
      - Auth
      description: Consumes the session's registration challenge whatever the outcome, then checks origin,
        RP ID, challenge and user verification. A missing, used, expired or foreign challenge and a
        rejected attestation are the generic 401. 409 if that credential is already registered.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegistrationRequest'
      responses:
        '201':
          description: Passkey registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/passkeys/{id}:
    patch:
      operationId: renamePasskey
      summary: Rename a passkey
      tags:
      - Auth
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRename'
      responses:
        '200':
          description: Passkey renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/passkeys/{id}/remove:
    post:
      operationId: removePasskey
      summary: Remove a passkey
      tags:
      - Auth
      description: Requires a current second-factor proof, sent in the body, which is why this is not a
        DELETE. The proof is consumed only if the passkey existed. A rejected proof is the generic 401 and
        counts toward the second-factor lockout. TOTP and recovery codes keep working after the last
        passkey goes.
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorProof'
      responses:
        '204':
          description: Passkey removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me:
    get:
      operationId: getMe
      summary: Get the authenticated user
      tags:
      - Auth
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts:
    get:
      operationId: listAccounts
      summary: List accounts with totals
      tags:
      - Accounts
      responses:
        '200':
          description: All accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createAccount
      summary: Create an account
      tags:
      - Accounts
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /accounts/{id}:
    get:
      operationId: getAccount
      summary: Get an account
      tags:
      - Accounts
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAccount
      summary: Rename an account or set its balance
      tags:
      - Accounts
      description: The balance is only ever typed by the user (D6).
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAccount
      summary: Delete an account
      tags:
      - Accounts
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Account deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /periods:
    get:
      operationId: listPeriods
      summary: List periods, newest first
      tags:
      - Periods
      responses:
        '200':
          description: All periods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: openPeriod
      summary: Open a month
      tags:
      - Periods
      description: 'Idempotent on retry: templates are cloned once per month.'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodOpenRequest'
      responses:
        '201':
          description: Month opened; active templates were cloned into items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        '200':
          description: Month was already open or closed; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /periods/{period}:
    get:
      operationId: getPeriod
      summary: Get a period
      tags:
      - Periods
      parameters:
      - $ref: '#/components/parameters/Period'
      responses:
        '200':
          description: The period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /periods/{period}/close:
    post:
      operationId: closePeriod
      summary: Close a month
      tags:
      - Periods
      description: Every pending fixed and occasional item becomes `overdue` and is owed in the first later
        month that is not closed, opened or not, together with every overdue expense this month owed (D7);
        each keeps its own `period` as its month of origin and appears once, in the Overdue section of the
        month in its `owedIn`. Pending income becomes `overdue` and stays in this month. Card charges are
        informational (D3) and stay as they are. Idempotent.
      parameters:
      - $ref: '#/components/parameters/Period'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Month closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /periods/{period}/card-totals:
    get:
      operationId: getCardChargeTotals
      summary: Sum card charges per card
      tags:
      - Periods
      description: Informational; never part of To pay, Outgoing or Balance (D3). Counts every card charge
        of the month, whatever its status. Every card has a row, with total 0 if it has no charges. Charges
        whose card was deleted are gathered in one last row with `cardId` and `cardName` null, which exists
        only when there are such charges, and they count toward `total`.
      parameters:
      - $ref: '#/components/parameters/Period'
      responses:
        '200':
          description: Per-card charges of the month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardChargeTotals'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /periods/{period}/overdue-items:
    get:
      operationId: listOverdueItems
      summary: List a month's overdue items
      tags:
      - Period items
      description: 'The month''s Overdue section (D7): the fixed and occasional items earlier months left
        unpaid that this month owes (`owedIn` is this month), oldest month of origin first, then the income
        every closed month left unreceived. Those expenses count toward this month''s `toPay` and `outgoing`;
        overdue income counts toward no month''s totals. A paid expense leaves the list but stays in this
        month''s `outgoing`.'
