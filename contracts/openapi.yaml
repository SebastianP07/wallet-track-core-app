    DashboardKpis:
      type: object
      required:
      - currentTotal
      - toPay
      - toReceive
      - surplus
      - savings
      - incoming
      - outgoing
      - balance
      properties:
        currentTotal:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: 'Total actual: sum of non-savings balances now (D6, D9).'
        toPay:
          allOf:
          - $ref: '#/components/schemas/NonNegativeMoney'
          description: 'Por pagar: pending fixed + occasional items of the month plus the unpaid overdue
            expenses it owes (D1, D7). Excludes card charges (D3) and the month''s own items once closing made
            them overdue, which a later month owes.'
        toReceive:
          allOf:
          - $ref: '#/components/schemas/NonNegativeMoney'
          description: 'Por llegar: pending income items of the month (D1). Excludes overdue items (D7).'
        surplus:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: 'Sobrante: currentTotal - toPay + toReceive, stopping at the money bound in either direction.
            Writes bound balances and items apart, not this sum.'
        savings:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: 'Ahorro: sum of savings balances now (D9).'
        incoming:
          allOf:
          - $ref: '#/components/schemas/NonNegativeMoney'
          description: 'Llega: all income items of the month, whatever their status (D2).'
        outgoing:
          allOf:
          - $ref: '#/components/schemas/NonNegativeMoney'
          description: 'Se va: all fixed + occasional items of the month plus every overdue expense it owes,
            whatever their status (D2, D3, D7).'
        balance:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: 'Balance: incoming - outgoing (D2).'
      additionalProperties: false
    ToPayBreakdown:
      type: object
      description: Pending amounts behind `toPay`, for the donut chart.
      required:
