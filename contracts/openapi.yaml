      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/PersonId'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: The platform with its members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /dashboard:
    get:
      operationId: getDashboard
      summary: Get everything the Dashboard shows for a month
      tags:
      - Dashboard
      description: 404 if the month has not been opened.
      parameters:
      - $ref: '#/components/parameters/PeriodQuery'
      responses:
        '200':
          description: All sections and KPIs of the month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dashboard/export:
    get:
      operationId: exportDashboardMonth
      summary: Download a month as CSV
      tags:
      - Dashboard
      description: |
        Columns: `kind,name,amount,due_date,status,tag`. One row per item of the month, of every kind, then one row per account
        with `kind` `account_<kind>` and an empty due date, status and tag. Account balances are today's in any month (D6, D9),
        so they are never to be summed with the items. No totals (D1). UTF-8 with a BOM, CRLF line ends, whole pesos as plain
        integers. Text cells are always quoted, and one that starts with a control character (tab, CR, LF), or with `=`, `+`, `-`
        or `@` or their full-width forms after any leading blanks, gets a leading `'` so that a spreadsheet reads it as text. So
        does such a character after a `;`, a tab or a line break inside a cell, for a spreadsheet that splits there. 404 if the
        month has not been opened.
      parameters:
      - $ref: '#/components/parameters/PeriodQuery'
      responses:
        '200':
          description: The month's items and the accounts.
          headers:
            Content-Disposition:
              description: '`attachment; filename="wallet-track-<YYYY-MM>.csv"`.'
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: 'Opaque session token: HttpOnly, Secure, SameSite=Lax, Path=/.'
  headers:
    SetSessionCookie:
      description: Sets, rotates or clears `__Host-session`.
      schema:
        type: string
    SetCsrfCookie:
      description: Sets `__Host-csrf`, the double-submit counterpart of `X-CSRF-Token`.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must match the `__Host-csrf` cookie (double-submit). See `GET /auth/csrf`.
      schema:
        type: string
        minLength: 1
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Period:
      name: period
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/YearMonth'
    PeriodQuery:
      name: period
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/YearMonth'
    ItemKindFilter:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ItemKind'
    ItemStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ItemStatus'
    TagFilter:
      name: tagId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    TemplateActiveFilter:
      name: active
      in: query
      required: false
      schema:
        type: boolean
  responses:
    BadRequest:
      description: The request is malformed or failed validation; `errors` lists the fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired or revoked session, an incomplete login, or rejected credentials.
        The message never says which.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Missing or mismatched CSRF token, or a rejected `Origin`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state; `detail` says how.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit or lockout in effect.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details, the only error body of this API.
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifier of the problem kind.
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Present on validation failures.
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
          description: JSON path of the rejected value, or the parameter name.
        message:
          type: string
      additionalProperties: false
    Money:
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: Whole Colombian pesos. May be negative. Bounded to what a JSON number carries safely
        in a browser.
      examples:
      - 5584474
    NonNegativeMoney:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: Whole Colombian pesos, zero or more.
      examples:
      - 64700
    YearMonth:
      type: string
      pattern: ^[2-9][0-9]{3}-(0[1-9]|1[0-2])$
      description: A month, as YYYY-MM, from 2000-01 on.
      examples:
      - 2026-11
    Id:
      type: string
      format: uuid
    Date:
      type: string
      format: date
      description: Calendar date in `America/Bogota`.
    Timestamp:
      type: string
      format: date-time
    HexColor:
      type: string
      pattern: ^#[0-9a-fA-F]{6}$
      examples:
      - '#3b82f6'
    Name:
      type: string
      minLength: 1
      maxLength: 120
    DayOfMonth:
      type: integer
      minimum: 1
      maximum: 31
      description: A day beyond the end of a month clamps to its last day (D11).
    BillingMonths:
      type: integer
      minimum: 1
      maximum: 120
      description: 'Months per payment: 1 is monthly, 6 is semiannual (D8).'
    CsrfToken:
      type: object
      required:
      - csrfToken
      properties:
        csrfToken:
          type: string
      additionalProperties: false
    PasswordLoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 1024
      additionalProperties: false
    LoginStep:
      type: object
      required:
      - nextStep
      properties:
        nextStep:
          type: string
          enum:
          - passkey
          - totp
          - enroll_mfa
          description: '`enroll_mfa` on first login, when MFA is not set up yet. `passkey` when the owner
            has one: it is the preferred factor, and TOTP and recovery codes still work.'
      additionalProperties: false
    TotpCodeRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
      additionalProperties: false
    RecoveryCodeRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
      additionalProperties: false
    User:
      type: object
      required:
      - id
      - email
      - mfaEnabled
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
        mfaEnabled:
          type: boolean
      additionalProperties: false
    MfaEnrollmentStartRequest:
      type: object
      required:
      - enrollmentSecret
      properties:
        enrollmentSecret:
          type: string
          minLength: 1
          maxLength: 128
          description: One-time secret printed by `cmd/admin create-owner`.
      additionalProperties: false
    MfaEnrollment:
      type: object
      required:
      - secret
      - otpauthUri
      properties:
        secret:
          type: string
          description: Base32 secret, for manual entry.
        otpauthUri:
          type: string
          format: uri
          description: Content of the QR code.
      additionalProperties: false
    MfaEnrollmentResult:
      type: object
      required:
      - user
      - recoveryCodes
      properties:
        user:
          $ref: '#/components/schemas/User'
        recoveryCodes:
          $ref: '#/components/schemas/RecoveryCodes'
      additionalProperties: false
    RecoveryCodes:
      type: array
      items:
        type: string
      minItems: 10
      maxItems: 10
      description: Ten one-time codes. Only their hashes are stored.
    RecoveryCodeList:
      type: object
      required:
      - recoveryCodes
      properties:
        recoveryCodes:
          $ref: '#/components/schemas/RecoveryCodes'
      additionalProperties: false
    RecoveryCodeStatus:
      type: object
      required:
      - remaining
      properties:
        remaining:
          type: integer
          minimum: 0
          maximum: 10
      additionalProperties: false
    SecondFactorProof:
      type: object
      description: A current second factor. `code` is 6 digits for `totp` and up to 64 characters for
        `recovery_code`. Using it consumes it.
      required:
      - method
      - code
      properties:
        method:
          type: string
          enum:
          - totp
          - recovery_code
        code:
          type: string
          minLength: 1
          maxLength: 64
      additionalProperties: false
    PasskeyDescriptor:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          const: public-key
        id:
          type: string
          description: Credential ID, base64url.
        transports:
          type: array
          items:
            type: string
    PasskeyCreationOptions:
      type: object
      description: WebAuthn creation options in their JSON form, as `parseCreationOptionsFromJSON` takes them.
      required:
      - publicKey
      properties:
        publicKey:
          type: object
          required:
          - rp
          - user
          - challenge
          - pubKeyCredParams
          properties:
            rp:
              type: object
              required:
              - id
              - name
              properties:
                id:
                  type: string
                name:
                  type: string
            user:
              type: object
              required:
              - id
              - name
              - displayName
              properties:
                id:
                  type: string
                  description: User handle, base64url.
                name:
                  type: string
                displayName:
                  type: string
            challenge:
              type: string
              description: Base64url.
            pubKeyCredParams:
              type: array
              items:
                type: object
                required:
                - type
                - alg
                properties:
                  type:
                    type: string
                    const: public-key
                  alg:
                    type: integer
            timeout:
              type: integer
              minimum: 0
              description: Milliseconds.
            excludeCredentials:
              type: array
              items:
                $ref: '#/components/schemas/PasskeyDescriptor'
            authenticatorSelection:
              type: object
              properties:
                authenticatorAttachment:
                  type: string
                requireResidentKey:
                  type: boolean
                residentKey:
                  type: string
                userVerification:
                  type: string
            attestation:
              type: string
    PasskeyAssertionOptions:
      type: object
      description: WebAuthn request options in their JSON form, as `parseRequestOptionsFromJSON` takes them.
      required:
      - publicKey
      properties:
        publicKey:
          type: object
          required:
          - challenge
          properties:
            challenge:
              type: string
              description: Base64url.
            timeout:
              type: integer
              minimum: 0
              description: Milliseconds.
            rpId:
              type: string
            allowCredentials:
              type: array
              items:
                $ref: '#/components/schemas/PasskeyDescriptor'
            userVerification:
              type: string
    PasskeyCredentialResponse:
      type: object
      description: A `PublicKeyCredential` in its JSON form. Binary values are base64url. Verified by the
        server, so its shape is checked there.
      required:
      - id
      - rawId
      - type
      - response
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          const: public-key
        authenticatorAttachment:
          type: string
        clientExtensionResults:
          type: object
          additionalProperties: true
        response:
          type: object
          required:
          - clientDataJSON
          properties:
            clientDataJSON:
              type: string
            attestationObject:
              type: string
              description: Registration only.
            transports:
              type: array
              items:
                type: string
              description: Registration only.
            authenticatorData:
              type: string
              description: Assertion only.
            signature:
              type: string
              description: Assertion only.
            userHandle:
              type:
              - string
              - 'null'
              description: Assertion only.
    PasskeyAssertionRequest:
      type: object
      required:
      - credential
      properties:
        credential:
          $ref: '#/components/schemas/PasskeyCredentialResponse'
      additionalProperties: false
    PasskeyRegistrationRequest:
      type: object
      required:
      - name
      - credential
      properties:
        name:
          $ref: '#/components/schemas/Name'
        credential:
          $ref: '#/components/schemas/PasskeyCredentialResponse'
      additionalProperties: false
    PasskeyRename:
      type: object
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/Name'
      additionalProperties: false
    Passkey:
      type: object
      required:
      - id
      - name
      - createdAt
      - lastUsedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/Name'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Null until it first completes a login.
      additionalProperties: false
    PasskeyList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Passkey'
      additionalProperties: false
    Session:
      type: object
      required:
      - id
      - userAgent
      - ip
      - createdAt
      - lastSeenAt
      - current
      - mfaPending
      properties:
        id:
          $ref: '#/components/schemas/Id'
        userAgent:
          type:
          - string
          - 'null'
          description: Of the request that started the session.
        ip:
          type:
          - string
          - 'null'
          description: Client address of the request that started the session.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastSeenAt:
          $ref: '#/components/schemas/Timestamp'
        current:
          type: boolean
          description: Whether this is the session making the request.
        mfaPending:
          type: boolean
          description: The password was accepted and the second factor has not been passed yet.
      additionalProperties: false
    SessionList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
      additionalProperties: false
    AccountKind:
      type: string
      enum:
      - bank
      - wallet
      - cash
      - food_card
      - savings
      description: '`savings` accounts count toward Savings instead of Current total (D9).'
    Account:
      type: object
      required:
      - id
      - name
      - kind
      - balance
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/Name'
        kind:
          $ref: '#/components/schemas/AccountKind'
        balance:
          $ref: '#/components/schemas/Money'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false
    AccountCreate:
      type: object
      required:
      - name
      - kind
      properties:
        name:
          $ref: '#/components/schemas/Name'
        kind:
          $ref: '#/components/schemas/AccountKind'
        balance:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
    AccountUpdate:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Name'
        kind:
          $ref: '#/components/schemas/AccountKind'
        balance:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
      minProperties: 1
    AccountList:
      type: object
      required:
      - items
      - currentTotal
      - savingsTotal
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        currentTotal:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: 'Total actual: sum of non-savings balances (D6, D9).'
        savingsTotal:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: 'Ahorro: sum of savings balances (D9).'
      additionalProperties: false
    PeriodStatus:
      type: string
      enum:
      - open
      - closed
    Period:
      type: object
      required:
      - id
      - period
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        period:
          $ref: '#/components/schemas/YearMonth'
        status:
          $ref: '#/components/schemas/PeriodStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false
    PeriodList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Period'
      additionalProperties: false
    PeriodOpenRequest:
      type: object
      required:
      - period
      properties:
        period:
          $ref: '#/components/schemas/YearMonth'
      additionalProperties: false
    ItemKind:
      type: string
      enum:
      - fixed
      - occasional
      - income
      - card_charge
    ItemStatus:
      type: string
      enum:
      - pending
      - done
      - overdue
      description: '`overdue` means the month closed while an expense or income item was still pending
        (D7). An overdue fixed or occasional item is owed in the month in its `owedIn`. Card charges never
        become overdue (D3).'
    Urgency:
      type: string
      enum:
      - none
      - yellow
      - red
      description: 'Computed by the backend from days left in `America/Bogota` (D11): `yellow` at 10 or
        fewer, `red` at 3 or fewer including past due. Always `none` for done items and items without
        a due date.'
    PeriodItem:
      type: object
      required:
      - id
      - period
      - kind
      - name
      - amount
      - dueDate
      - templateId
      - personId
      - cardId
      - tagId
      - status
      - doneAt
      - owedIn
      - urgency
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        period:
          $ref: '#/components/schemas/YearMonth'
        kind:
          $ref: '#/components/schemas/ItemKind'
        name:
          $ref: '#/components/schemas/Name'
        amount:
          $ref: '#/components/schemas/NonNegativeMoney'
        dueDate:
          description: Set on fixed and occasional items.
          oneOf:
          - $ref: '#/components/schemas/Date'
          - type: 'null'
        templateId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        personId:
          description: Platform member this income item is for (D4).
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        cardId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        tagId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        status:
          $ref: '#/components/schemas/ItemStatus'
        doneAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        owedIn:
          description: 'Set on a fixed or occasional item a closed month left unpaid: the month whose Overdue
            section lists it and whose `toPay` and `outgoing` count it (D7). `period` stays its month of
            origin. A paid one keeps the month that owed it when it was paid. Null on every other item.'
          oneOf:
          - $ref: '#/components/schemas/YearMonth'
          - type: 'null'
        urgency:
          $ref: '#/components/schemas/Urgency'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false
    ExpenseItemCreate:
      type: object
      required:
      - kind
      - name
      - amount
      - dueDate
      properties:
        kind:
          type: string
          enum:
          - fixed
          - occasional
        name:
          $ref: '#/components/schemas/Name'
        amount:
          $ref: '#/components/schemas/NonNegativeMoney'
        dueDate:
          $ref: '#/components/schemas/Date'
        tagId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      additionalProperties: false
    IncomeItemCreate:
      type: object
      required:
      - kind
      - name
      - amount
      properties:
        kind:
          type: string
          const: income
        name:
          $ref: '#/components/schemas/Name'
        amount:
          $ref: '#/components/schemas/NonNegativeMoney'
        tagId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      additionalProperties: false
    CardChargeItemCreate:
      type: object
      required:
      - kind
      - name
      - amount
      - cardId
      properties:
        kind:
          type: string
          const: card_charge
        name:
          $ref: '#/components/schemas/Name'
        amount:
          $ref: '#/components/schemas/NonNegativeMoney'
        cardId:
          $ref: '#/components/schemas/Id'
        tagId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      additionalProperties: false
    PeriodItemCreate:
      oneOf:
      - $ref: '#/components/schemas/ExpenseItemCreate'
      - $ref: '#/components/schemas/IncomeItemCreate'
      - $ref: '#/components/schemas/CardChargeItemCreate'
      discriminator:
        propertyName: kind
        mapping:
          fixed: '#/components/schemas/ExpenseItemCreate'
          occasional: '#/components/schemas/ExpenseItemCreate'
          income: '#/components/schemas/IncomeItemCreate'
          card_charge: '#/components/schemas/CardChargeItemCreate'
    PeriodItemUpdate:
      type: object
      description: '`kind` and `status` cannot be edited; the done endpoints change `status`. `dueDate`
        is refused on income and card charge items, which have none. `cardId` moves a card charge to another
        card, including one whose card was deleted, but null cannot remove it (400); any other kind refuses a card.'
      properties:
        name:
          $ref: '#/components/schemas/Name'
        amount:
          $ref: '#/components/schemas/NonNegativeMoney'
        dueDate:
          $ref: '#/components/schemas/Date'
        cardId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        tagId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      additionalProperties: false
      minProperties: 1
    ItemKindTotal:
      type: object
      required:
      - total
      - pending
      properties:
        total:
          allOf:
          - $ref: '#/components/schemas/NonNegativeMoney'
          description: Sum of every item of this kind in the month.
        pending:
          allOf:
          - $ref: '#/components/schemas/NonNegativeMoney'
          description: Sum of its pending items.
      additionalProperties: false
    PeriodItemTotals:
      type: object
      required:
      - fixed
      - occasional
      - income
      - cardCharge
      - overdue
      - toPay
      - toReceive
      properties:
        toPay:
          allOf:
          - $ref: '#/components/schemas/NonNegativeMoney'
          description: 'Por pagar: pending fixed + occasional items of the month plus the unpaid overdue
            expenses it owes, `overdue.pending` (D1, D7). Excludes card charges (D3) and the month''s own items
            once closing made them overdue, which a later month owes.'
        toReceive:
          allOf:
          - $ref: '#/components/schemas/NonNegativeMoney'
          description: 'Por llegar: pending income items of the month (D1). Excludes received and overdue
            items (D7).'
        fixed:
          $ref: '#/components/schemas/ItemKindTotal'
        occasional:
          $ref: '#/components/schemas/ItemKindTotal'
        income:
          $ref: '#/components/schemas/ItemKindTotal'
        cardCharge:
          $ref: '#/components/schemas/ItemKindTotal'
        overdue:
          allOf:
          - $ref: '#/components/schemas/ItemKindTotal'
          description: 'Overdue fixed and occasional items earlier months left unpaid that this month owes
            (D7): `total` is every one owed here, paid since or not, and `pending` the unpaid ones. Not in
            `items`, which hold the month''s own items; the overdue list shows them. Each part stops at the
            money bound if they add up past it.'
      additionalProperties: false
    PeriodItemList:
      type: object
      required:
      - items
      - totals
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PeriodItem'
        totals:
          $ref: '#/components/schemas/PeriodItemTotals'
      additionalProperties: false
    OverdueItemList:
      type: object
      required:
      - items
      - expenseTotal
      - incomeTotal
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PeriodItem'
        expenseTotal:
          allOf:
          - $ref: '#/components/schemas/NonNegativeMoney'
          description: Sum of the unpaid overdue expenses this month owes, the same as the month's
            `overdue.pending`, stopping at the money bound if they add up past it.
        incomeTotal:
          allOf:
          - $ref: '#/components/schemas/NonNegativeMoney'
          description: Sum of overdue income across every closed month, stopping at the money bound if they
            add up past it. Counts toward no month's totals.
      additionalProperties: false
